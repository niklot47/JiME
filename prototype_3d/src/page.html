<title>JiME 3D Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL table with a slim parchment-and-ink control card floating top-left */
:root {
  --table: #14120f;      /* scene clear colour, the dark gaming table */
  --card: rgba(28, 24, 19, 0.86);
  --ink: #efe4cf;        /* parchment-light text */
  --muted: #b5a68b;
  --gold: #d6a85a;       /* brass accent, as on the original UI frames */
  --line: rgba(214, 168, 90, 0.35);
  --display: "Cormorant SC", "Cormorant", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--table); color: var(--ink); font-family: var(--body); overflow: hidden; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.card {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  max-width: min(340px, calc(100% - 32px));
  background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px; display: grid; gap: 10px; backdrop-filter: blur(6px);
}
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.04em; color: var(--gold); text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
.seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; min-width: 0; }
button {
  font: 500 0.88rem var(--body); color: var(--ink); background: transparent; border: 0;
  padding: 7px 10px; cursor: pointer;
}
button[aria-pressed="true"] { background: rgba(214, 168, 90, 0.22); color: #fff4dc; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
label { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--gold); }
#reset { border: 1px solid var(--line); border-radius: 4px; }
#status {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; max-width: 560px; text-align: center; font-size: 0.92rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; color: var(--ink);
}
.src { font-size: 0.76rem; color: var(--muted); margin: 0; }
@media (max-width: 480px) { h1 { font-size: 1.2rem; } .sub { display: none; } }
</style>

<div id="view" aria-label="3D-сцена поля"></div>
<section class="card" aria-label="Управление">
  <h1>Охота на бандитов</h1>
  <p class="sub">Тайлы, жетоны, частицы и 3D-объекты извлечены из установленной игры. Вращайте сцену мышью или пальцем.</p>
  <div class="seg" role="group" aria-label="Вид">
    <button id="m-map" data-mode="map" aria-pressed="true">Карта приключения</button>
    <button id="m-battle" data-mode="battle" aria-pressed="false">Боевое поле</button>
  </div>
  <div class="row">
    <label for="rain"><input type="checkbox" id="rain"> Дождь</label>
    <button id="reset" type="button">Начать заново</button>
  </div>
  <p class="src">Прототип на Three.js: проверка стека TypeScript + Tauri</p>
</section>
<p id="status" role="status">Загрузка…</p>
