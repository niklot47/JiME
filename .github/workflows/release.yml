# Windows and Linux installers built by GitHub Actions.
# - push a tag "v*" (e.g. git tag v1.0.0 && git push origin v1.0.0) -> draft GitHub Release with the installers attached;
# - "Run workflow" by hand (Actions tab) -> installers as workflow artifacts only.
# The installers contain the app and the importer scripts only: FFG content is imported on the user's machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: |
              apps/app/src-tauri/target/release/bundle/nsis/*.exe
              apps/app/src-tauri/target/release/bundle/msi/*.msi
          # 22.04: the oldest supported glibc, so the AppImage / .deb run on more distributions
          - name: linux
            os: ubuntu-22.04
            bundles: |
              apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4   # version taken from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Check that the app version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content apps/app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tauri.conf.json version $v does not match tag ${{ github.ref_name }}" }

      - name: Build installers (and draft release for tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/app
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "JiME Reborn ${{ github.ref_name }}"
          releaseBody: |
            Фанатский компаньон для «Властелин колец: Путешествия по Средиземью».
            Контент игры в установщик не входит: при первом запуске мастер импортирует его из вашей копии игры (нужен Python 3).
            Windows: установщик не подписан — SmartScreen может показать предупреждение («Подробнее» → «Выполнить в любом случае»).
            Linux: AppImage (сделать исполняемым: chmod +x), .deb или .rpm. Игру из Steam (через Proton) мастер находит сам.
          releaseDraft: true
          prerelease: false

      - name: Upload installers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: jime-reborn-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
