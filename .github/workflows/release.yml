# Windows installers (NSIS .exe + MSI) built by GitHub Actions.
# - push a tag "v*" (e.g. git tag v0.1.0 && git push origin v0.1.0) -> draft GitHub Release with the installers attached;
# - "Run workflow" by hand (Actions tab) -> installers as a workflow artifact only.
# The installers contain the app and the importer scripts only: FFG content is imported on the user's machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version taken from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Check that the app version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content apps/app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tauri.conf.json version $v does not match tag ${{ github.ref_name }}" }

      - name: Build installers (and draft release for tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/app
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "JiME Reborn ${{ github.ref_name }}"
          releaseBody: |
            Фанатский компаньон для «Властелин колец: Путешествия по Средиземью».
            Контент игры в установщик не входит: при первом запуске мастер импортирует его из вашей копии игры (нужен Python 3).
            Установщик не подписан — Windows SmartScreen может показать предупреждение («Подробнее» → «Выполнить в любом случае»).
          releaseDraft: true
          prerelease: true

      - name: Upload installers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: jime-reborn-windows
          path: |
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
