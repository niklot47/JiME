# CI: unit tests, type checks and frontend build on every push / PR.
# FFG content is never available here: only small test fixtures are used.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is included on purpose: path handling differs (see fix a4fb48e)
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version taken from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check (packages)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Frontend build (app, without Tauri)
        run: pnpm --filter @jime/app build

  python:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile engine-py and importer
        run: python -m compileall -q engine-py tools/importer
